global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: storenode
    static_configs:
      - targets: [storenode1:9100, storenode2:9100, storenode3:9100, storenode4:9100, storenode5:9100]
  - job_name: worker
    static_configs:
      - targets: [worker1:9103, worker2:9103]
  - job_name: replayer
    static_configs:
      - targets: [replayer:9102]
  - job_name: server
    static_configs:
      - targets: [server:8081]
