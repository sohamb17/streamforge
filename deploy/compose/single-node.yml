# Gate 1 setup: Kafka, ONE store node (no replication), one worker, Postgres.
# Used by scripts/gate1.sh. Not for the demo.
name: sf-gate1

services:
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka:/var/lib/kafka/data]
  storenode1:
    image: streamforge:dev
    command: storenode -id 1 -peers 1=storenode1:7000 -data /data
    volumes: [raft1:/data]
  worker1:
    image: streamforge:dev
    restart: unless-stopped
    command: >
      worker -brokers kafka:9092 -topic trips -store 1=storenode1:7000
      -postgres postgres://streamforge:streamforge@postgres:5432/streamforge
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: streamforge, POSTGRES_PASSWORD: streamforge, POSTGRES_DB: streamforge }
  tools:
    image: streamforge:dev
    profiles: [tools]
    volumes: [../../data:/data:ro]

volumes: { raft1: {}, kafka: {} }
